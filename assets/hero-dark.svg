<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#0894FF"/><stop offset="0.33" stop-color="#C959DD"/><stop offset="0.67" stop-color="#FF2E54"/><stop offset="1.00" stop-color="#FF9004"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1E1E22"/></pattern>
<radialGradient id="fade" cx="50%" cy="40%" r="62%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="m"><rect width="1200" height="540" fill="url(#fade)"/></mask>
<filter id="blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="70"/></filter>
<clipPath id="card"><rect x="1" y="1" width="1198" height="538" rx="28"/></clipPath>
<style>.caret{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style></defs>
<rect x="0.5" y="0.5" width="1199" height="539" rx="28" fill="#0A0A0B" stroke="#232326"/>
<g clip-path="url(#card)">
  <rect width="1200" height="540" fill="url(#dots)" mask="url(#m)"/>
  <ellipse cx="600" cy="580" rx="460" ry="110" fill="url(#g)" filter="url(#blur)" opacity="0.34">
    <animate attributeName="opacity" values="0.34;0.54;0.34" dur="7s" repeatCount="indefinite"/>
  </ellipse>
</g>
<rect x="404.2" y="66" width="391.6" height="36" rx="18" fill="#121214" stroke="#232326"/>
<circle cx="426.2" cy="84" r="4.5" fill="url(#g)"/>
<text x="444.2" y="88.5" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" fill="#8E8E93"
  textLength="327.6" lengthAdjust="spacing">ROBERT  ·  YC FOUNDER  ·  SAN FRANCISCO</text>
<text x="600" y="214" text-anchor="middle" font-size="84" font-weight="700" letter-spacing="-3.2" fill="#F5F5F7">Robotics. Harnesses.</text>
<text x="600" y="306" text-anchor="middle" font-size="84" font-weight="700" letter-spacing="-3.2" fill="url(#g)">GPUs. Compute.</text>
<text x="600" y="378" text-anchor="middle" font-size="24" fill="#8E8E93">YC founder. I scaled stormy.ai to $250k ARR, solo.</text>
<text x="600" y="412" text-anchor="middle" font-size="24" fill="#8E8E93">Now I research the infra under intelligence.</text>
<text x="379.8" y="474" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" fill="#5C5C62"
  textLength="422.4" lengthAdjust="spacing">$ focus --robotics --harness --gpu --compute</text>
<rect class="caret" x="810.2" y="460" width="9" height="18" rx="1.5" fill="url(#g)"/></svg>
